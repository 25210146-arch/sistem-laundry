# Nama Aplikasi
spring.application.name=sistem-laundry

# Port Web Server (Baru)
server.port=8081

# Koneksi Database MySQL
spring.datasource.url=jdbc:mysql://localhost:3307/laundry_kiloan?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Pengaturan Spring Data JPA (Mode 'update' agar data pesanan tidak terhapus saat restart)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Mematikan eksekusi ulang data.sql agar tidak bentrok Primary Key saat restart
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false
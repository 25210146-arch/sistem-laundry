spring.application.name=sistem-laundry

# Port dinamis untuk server cloud (otomatis pakai 8081 jika di lokal)
server.port=${PORT:8081}

# Koneksi Database dinamis (otomatis pakai database lokal jika di laptop)
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3307/laundry_kiloan?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Makassar}
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:}

# Pengaturan JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - Sistem Laundry O2O</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #f0f9ff 0%, #f8fafc 50%, #eef2ff 100%);
            min-height: 100vh;
            color: #0f172a;
            overflow-x: hidden;
            position: relative;
        }

        /* Aksen Cahaya Lembut (Light Ambient) */
        .ambient-blob-1 {
            position: fixed;
            top: -120px;
            left: -100px;
            width: 380px;
            height: 380px;
            background: rgba(14, 165, 233, 0.14);
            filter: blur(90px);
            border-radius: 50%;
            z-index: 0;
        }
        .ambient-blob-2 {
            position: fixed;
            bottom: -120px;
            right: -100px;
            width: 400px;
            height: 400px;
            background: rgba(99, 102, 241, 0.12);
            filter: blur(100px);
            border-radius: 50%;
            z-index: 0;
        }

        /* Kartu Light Glassmorphism */
        .glass-card-light {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.95);
            border-radius: 22px;
            box-shadow: 0 20px 45px -10px rgba(15, 23, 42, 0.08), 0 0 0 1px rgba(14, 165, 233, 0.12);
            z-index: 1;
        }

        .brand-badge {
            display: inline-block;
            padding: 5px 14px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.4px;
            text-transform: uppercase;
            color: #0284c7;
            background: rgba(14, 165, 233, 0.1);
            border: 1px solid rgba(14, 165, 233, 0.25);
            border-radius: 999px;
            margin-bottom: 12px;
        }

        .form-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #334155;
        }

        .form-control-modern {
            background: rgba(248, 250, 252, 0.9);
            border: 1.5px solid #e2e8f0;
            color: #0f172a;
            border-radius: 12px;
            padding: 11px 15px;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .form-control-modern::placeholder {
            color: #94a3b8;
        }

        .form-control-modern:focus {
            background: #ffffff;
            border-color: #0ea5e9;
            box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.12);
            color: #0f172a;
            outline: none;
        }

        .btn-modern {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-weight: 600;
            letter-spacing: 0.2px;
            color: #ffffff;
            box-shadow: 0 8px 18px rgba(37, 99, 235, 0.22);
            transition: all 0.2s ease;
        }

        .btn-modern:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 24px rgba(37, 99, 235, 0.3);
            background: linear-gradient(135deg, #0ea5e9, #3b82f6);
            color: #ffffff;
        }

        .demo-box-light {
            background: rgba(240, 249, 255, 0.75);
            border: 1px dashed #7dd3fc;
            border-radius: 12px;
            font-size: 0.82rem;
            color: #475569;
        }

        .demo-box-light code {
            color: #0369a1;
            background: #e0f2fe;
            padding: 2px 7px;
            border-radius: 6px;
            font-weight: 600;
        }

        .back-link {
            color: #64748b;
            font-weight: 500;
            transition: color 0.2s ease;
        }
        .back-link:hover {
            color: #0284c7;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center p-3">

<div class="ambient-blob-1"></div>
<div class="ambient-blob-2"></div>

<div class="glass-card-light p-4 p-md-5" style="max-width: 420px; width: 100%;">
    <div class="text-center mb-4">
        <span class="brand-badge">O2O POS SYSTEM</span>
        <h4 class="fw-bold text-dark mb-1">Login Admin POS</h4>
        <p class="text-muted small mb-0">Masuk untuk mengelola reservasi dan cucian</p>
    </div>

    <div th:if="${param.error}" class="alert alert-danger py-2 text-center small rounded-3">
        Username atau password salah!
    </div>
    <div th:if="${param.logout}" class="alert alert-success py-2 text-center small rounded-3">
        Anda telah berhasil keluar (logout).
    </div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" class="form-control form-control-modern" id="username" name="username" placeholder="Masukkan username" required autofocus>
        </div>
        <div class="mb-4">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control form-control-modern" id="password" name="password" placeholder="Masukkan password" required>
        </div>
        <button type="submit" class="btn btn-modern w-100">Masuk ke Dashboard</button>
    </form>

    <!-- Catatan Akun Demo Penguji -->
    <div class="demo-box-light mt-4 p-3">
        <div class="fw-semibold text-dark mb-1">Akun Demo Penguji:</div>
        <div class="d-flex justify-content-between">
            <span>Username: <code>admin</code></span>
            <span>Password: <code>admin123</code></span>
        </div>
    </div>

    <div class="text-center mt-4">
        <a th:href="@{/}" class="text-decoration-none small back-link">&larr; Kembali ke Halaman Pelanggan</a>
    </div>
</div>

</body>
</html>

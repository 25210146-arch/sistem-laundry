<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - Sistem Laundry O2O</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">

<div class="card shadow-sm p-4" style="max-width: 400px; width: 100%;">
    <div class="text-center mb-4">
        <h4 class="fw-bold">Login Admin POS</h4>
        <p class="text-muted small">Masuk untuk mengelola reservasi dan cucian</p>
    </div>

    <div th:if="${param.error}" class="alert alert-danger py-2 text-center small">
        Username atau password salah!
    </div>
    <div th:if="${param.logout}" class="alert alert-success py-2 text-center small">
        Anda telah berhasil keluar (logout).
    </div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" class="form-control" id="username" name="username" placeholder="Masukkan username" required autofocus>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" name="password" placeholder="Masukkan password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 fw-semibold">Masuk ke Dashboard</button>
    </form>

    <!-- Catatan Akun Demo Penguji -->
    <div class="alert alert-light border mt-3 mb-0 py-2 px-3 small text-muted">
        <div class="fw-semibold text-dark mb-1">Akun Demo Penguji:</div>
        <div>Username: <code class="text-primary">admin</code></div>
        <div>Password: <code class="text-primary">admin123</code></div>
    </div>

    <div class="text-center mt-3">
        <a th:href="@{/}" class="text-decoration-none small text-secondary">&larr; Kembali ke Halaman Pelanggan</a>
    </div>
</div>

</body>
</html>

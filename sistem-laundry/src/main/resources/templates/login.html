<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - Sistem Laundry O2O</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f4f7fb;
            /* Pola Tech Dot-Grid + Gradien Cerah */
            background-image: 
                radial-gradient(rgba(14, 165, 233, 0.22) 1.25px, transparent 1.25px),
                linear-gradient(135deg, #e0f2fe 0%, #f8fafc 48%, #e0e7ff 100%);
            background-size: 26px 26px, 100% 100%;
            min-height: 100vh;
            color: #0f172a;
            overflow-x: hidden;
            position: relative;
        }

        /* Bentuk Geometris & Cahaya Latar */
        .orb-cyan {
            position: fixed;
            top: -80px;
            left: -60px;
            width: 340px;
            height: 340px;
            background: radial-gradient(circle, rgba(14, 165, 233, 0.25) 0%, transparent 70%);
            filter: blur(45px);
            z-index: 0;
        }
        .orb-indigo {
            position: fixed;
            bottom: -90px;
            right: -60px;
            width: 380px;
            height: 380px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.22) 0%, transparent 70%);
            filter: blur(50px);
            z-index: 0;
        }

        /* Kartu Glassmorphism dengan Border & Top Accent */
        .glass-card-pro {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            box-shadow: 
                0 25px 50px -12px rgba(15, 23, 42, 0.1),
                0 0 0 1px rgba(14, 165, 233, 0.16);
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        /* Garis Gradien Neon Tipis di Puncak Kartu */
        .glass-card-pro::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #06b6d4, #2563eb, #6366f1);
        }

        /* Kotak Ikon Header */
        .icon-hub {
            width: 58px;
            height: 58px;
            margin: 0 auto 14px;
            border-radius: 16px;
            background: linear-gradient(135deg, #0284c7, #4f46e5);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.65rem;
            box-shadow: 0 10px 22px rgba(37, 99, 235, 0.28);
        }

        .brand-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: #0369a1;
            background: #e0f2fe;
            border: 1px solid #bae6fd;
            border-radius: 999px;
            margin-bottom: 10px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            background-color: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 6px #10b981;
        }

        .form-label {
            font-size: 0.84rem;
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
        }

        /* Input Group dengan Ikon */
        .input-wrapper {
            position: relative;
        }
        .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            font-size: 1.05rem;
            transition: color 0.2s ease;
        }

        .form-control-modern {
            background: #f8fafc;
            border: 1.5px solid #cbd5e1;
            color: #0f172a;
            border-radius: 12px;
            padding: 11px 14px 11px 42px;
            font-size: 0.94rem;
            transition: all 0.2s ease;
        }

        .form-control-modern:focus {
            background: #ffffff;
            border-color: #0284c7;
            box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.14);
            outline: none;
        }

        .input-wrapper:focus-within i {
            color: #0284c7;
        }

        .btn-modern {
            background: linear-gradient(135deg, #0284c7, #2563eb, #4f46e5);
            background-size: 200% auto;
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-weight: 600;
            color: #ffffff;
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.25);
            transition: all 0.3s ease;
        }

        .btn-modern:hover {
            background-position: right center;
            transform: translateY(-1px);
            box-shadow: 0 14px 26px rgba(37, 99, 235, 0.34);
            color: #ffffff;
        }

        /* Box Akun Demo Berbingkai Halus */
        .demo-card {
            background: linear-gradient(135deg, rgba(240, 249, 255, 0.9), rgba(238, 242, 255, 0.9));
            border: 1px dashed #38bdf8;
            border-radius: 14px;
            font-size: 0.82rem;
            color: #334155;
        }

        .demo-card code {
            color: #0369a1;
            background: #ffffff;
            border: 1px solid #bae6fd;
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: 700;
        }

        .back-link {
            color: #64748b;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        .back-link:hover {
            color: #0284c7;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center p-3">

<div class="orb-cyan"></div>
<div class="orb-indigo"></div>

<div class="glass-card-pro p-4 p-md-5" style="max-width: 430px; width: 100%;">
    <div class="text-center mb-4">
        <div class="icon-hub">
            <i class="bi bi-qr-code-scan"></i>
        </div>
        <div class="brand-pill">
            <span class="status-dot"></span> O2O LAUNDRY POS
        </div>
        <h4 class="fw-bold text-dark mb-1">Portal Admin</h4>
        <p class="text-muted small mb-0">Masuk untuk verifikasi reservasi &amp; scan QR</p>
    </div>

    <div th:if="${param.error}" class="alert alert-danger py-2 text-center small rounded-3">
        <i class="bi bi-exclamation-circle me-1"></i> Username atau password salah!
    </div>
    <div th:if="${param.logout}" class="alert alert-success py-2 text-center small rounded-3">
        <i class="bi bi-check-circle me-1"></i> Anda telah berhasil keluar (logout).
    </div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <div class="input-wrapper">
                <i class="bi bi-person"></i>
                <input type="text" class="form-control form-control-modern" id="username" name="username" placeholder="Masukkan username" required autofocus>
            </div>
        </div>
        <div class="mb-4">
            <label for="password" class="form-label">Password</label>
            <div class="input-wrapper">
                <i class="bi bi-shield-lock"></i>
                <input type="password" class="form-control form-control-modern" id="password" name="password" placeholder="Masukkan password" required>
            </div>
        </div>
        <button type="submit" class="btn btn-modern w-100">
            Masuk ke Dashboard <i class="bi bi-arrow-right-short ms-1"></i>
        </button>
    </form>

    <!-- Catatan Akun Demo Penguji -->
    <div class="demo-card mt-4 p-3">
        <div class="fw-semibold text-dark mb-1 d-flex align-items-center gap-1">
            <i class="bi bi-info-circle-fill text-primary"></i> Akun Demo Penguji:
        </div>
        <div class="d-flex justify-content-between align-items-center mt-1">
            <span>User: <code>admin</code></span>
            <span>Pass: <code>admin123</code></span>
        </div>
    </div>

    <div class="text-center mt-4">
        <a th:href="@{/}" class="text-decoration-none small back-link">
            <i class="bi bi-arrow-left me-1"></i> Kembali ke Halaman Pelanggan
        </a>
    </div>
</div>

</body>
</html>

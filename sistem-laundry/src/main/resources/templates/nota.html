<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pemesanan Laundry O2O</title>
    <!-- Memanggil CSS Bootstrap agar tampilan rapi -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5 mb-5" style="max-width: 600px;">
    <!-- Notifikasi Jika Kuota Habis (dari Redirect Controller) -->
    <div th:if="${param.error}" class="alert alert-danger text-center">
        Mohon maaf, kuota untuk layanan yang Anda pilih sudah habis atau sedang penuh.
    </div>

    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white text-center py-3">
            <h3 class="mb-0">Reservasi Laundry</h3>
            <small>Pesan sekarang, antar nanti tanpa antre!</small>
        </div>
        <div class="card-body p-4">
            
            <!-- Form mengarah ke /review-pesanan -->
            <form action="/review-pesanan" method="post">
                
                <h5 class="mb-3 border-bottom pb-2">1. Data Diri</h5>
                <div class="mb-3">
                    <label class="form-label">Nama Lengkap</label>
                    <input type="text" name="namaPelanggan" class="form-control" placeholder="Masukkan nama Anda" required>
                </div>
                <div class="mb-4">
                    <label class="form-label">Nomor WhatsApp / HP</label>
                    <input type="number" name="noHp" class="form-control" placeholder="Contoh: 08123456789" required>
                    <div class="form-text">Nomor HP akan digunakan untuk mengecek nota dan mengambil pakaian.</div>
                </div>

                <h5 class="mb-3 border-bottom pb-2">2. Pilihan Layanan (Cek Kuota)</h5>
                <div class="mb-4">
                    <!-- Looping data layanan dari database -->
                    <div th:each="layanan : ${daftarLayanan}" class="form-check mb-2 p-3 border rounded" 
                         th:classappend="${layanan.kuotaTersedia == null || layanan.kuotaTersedia <= 0} ? 'bg-secondary text-white opacity-50' : 'bg-white'">
                        
                        <input class="form-check-input ms-1" type="radio" name="idLayanan" 
                               th:value="${layanan.idLayanan}" 
                               th:disabled="${layanan.kuotaTersedia == null || layanan.kuotaTersedia <= 0}" required>
                        
                        <label class="form-check-label ms-2 d-block">
                            <strong th:text="${layanan.jenisLayanan}">Reguler</strong> 
                            <span class="float-end fw-bold" th:text="'Rp' + ${layanan.harga} + '/kg'">Rp7000/kg</span>
                            <br>
                            <small th:if="${layanan.kuotaTersedia != null && layanan.kuotaTersedia > 0}" 
                                   class="text-success fw-bold" 
                                   th:text="'Tersedia: ' + ${layanan.kuotaTersedia} + ' slot (Estimasi ' + ${layanan.estimasiJam} + ' jam)'"></small>
                            <small th:if="${layanan.kuotaTersedia == null || layanan.kuotaTersedia <= 0}" 
                                   class="text-white fw-bold">Kuota Penuh</small>
                        </label>
                    </div>
                </div>

                <h5 class="mb-3 border-bottom pb-2">3. Kategori Cucian</h5>
                <div class="mb-4">
                    <select name="kategoriCucian" class="form-select" required>
                        <option value="Cuci Kering">Cuci Kering (Harga Standar)</option>
                        <option value="Cuci + Lipat">Cuci + Lipat (Harga Standar)</option>
                        <option value="Cuci + Setrika">Cuci + Setrika (+Rp5.000/kg)</option>
                    </select>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-primary btn-lg">Lanjut ke Ringkasan Pesanan</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Tombol Melayang "Pesanan Saya" (Otomatis muncul jika ada riwayat pesanan di browser) -->
<div id="btnPesananSayaContainer" style="display: none; position: fixed; bottom: 20px; right: 20px; z-index: 1000;">
    <a id="linkPesananSaya" href="#" class="btn btn-success btn-lg shadow rounded-pill px-4 fw-bold">
        🧺 Pesanan Saya
    </a>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const lastOrderId = localStorage.getItem("pesananLaundryTerakhir") || localStorage.getItem("laundry_last_order_id");
        if (lastOrderId) {
            const container = document.getElementById("btnPesananSayaContainer");
            const link = document.getElementById("linkPesananSaya");
            link.href = "/nota?id=" + lastOrderId;
            container.style.display = "block";
        }
    });
</script>

</body>
</html>
